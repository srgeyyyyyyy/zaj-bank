<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Присоединиться — ZAJ BANK</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="has-back-button" data-page="login">
    <button class="back-button" type="button" data-back-button data-back-fallback="index.html" aria-label="Назад">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 5-7 7 7 7"></path></svg>
    </button>
    <main class="auth-page auth-centered">
      <section class="auth-card auth-card-centered panel">
        <a class="brand auth-brand" href="index.html" aria-label="ZAJ BANK">
          <span class="brand-mark" aria-hidden="true">
            <span></span>
            <span></span>
            <span></span>
          </span>
          <span>
            <strong>ZAJ</strong>
            <small>BANK</small>
          </span>
        </a>

        <div class="auth-title">
          <p class="eyebrow">secure access</p>
          <h1>Присоединиться к ZAJ BANK</h1>
          <p>Вход и регистрация на одной странице. Сначала телефон, потом SMS-код.</p>
        </div>

        <div class="auth-tabs" aria-label="Выберите действие">
          <button class="is-active" type="button" data-auth-tab="login">Войти</button>
          <button type="button" data-auth-tab="register">Создать аккаунт</button>
        </div>

        <div class="auth-intent" data-auth-intent>
          <svg><use href="icons.svg#icon-lock"></use></svg>
          <span>Введите телефон, получите SMS-код и откройте личный кабинет.</span>
        </div>

        <form class="auth-form is-active" id="loginForm">
          <label>
            Телефон
            <input name="phone" type="tel" placeholder="+7 700 000 00 00" autocomplete="tel" required />
          </label>
          <div class="sms-step" id="loginSmsStep" hidden>
            <label>
              SMS-код
              <input name="smsCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 цифр" autocomplete="one-time-code" />
            </label>
            <p data-login-sms-hint>Код придет на номер аккаунта.</p>
          </div>
          <button class="primary-button" id="loginSubmit" type="submit">
            <svg><use href="icons.svg#icon-phone"></use></svg>
            Получить SMS-код
          </button>
          <p class="auth-alt">
            Нет аккаунта?
            <button type="button" data-auth-switch="register">Создать кабинет</button>
          </p>
        </form>

        <form class="auth-form" id="registerForm">
          <label>
            Имя
            <input name="name" type="text" placeholder="Айдар" autocomplete="given-name" required />
          </label>
          <label>
            Телефон
            <input name="phone" type="tel" placeholder="+7 700 000 00 00" autocomplete="tel" required />
          </label>
          <div class="sms-step" id="registerSmsStep" hidden>
            <label>
              SMS-код
              <input name="smsCode" type="text" inputmode="numeric" maxlength="6" placeholder="6 цифр" autocomplete="one-time-code" />
            </label>
            <p data-sms-hint>Код придет на указанный номер.</p>
          </div>
          <button class="primary-button" id="registerSubmit" type="submit">
            <svg><use href="icons.svg#icon-check"></use></svg>
            Получить SMS-код
          </button>
          <p class="auth-alt">
            Уже есть аккаунт?
            <button type="button" data-auth-switch="login">Войти</button>
          </p>
        </form>
      </section>
    </main>

    <div class="toast" role="status" aria-live="polite"></div>
    <script type="module" src="script.js"></script>
  </body>
</html>
