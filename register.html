<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="refresh" content="0; url=login.html?mode=register" />
    <title>Регистрация — ZAJ BANK</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body class="has-back-button" data-page="register">
    <button class="back-button" type="button" data-back-button data-back-fallback="index.html" aria-label="Назад">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5"></path><path d="m12 5-7 7 7 7"></path></svg>
    </button>
    <main class="auth-page auth-redirect">
      <section class="auth-card panel">
        <a class="brand auth-brand" href="index.html" aria-label="ZAJ BANK">
          <span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span>
          <span><strong>ZAJ</strong><small>BANK</small></span>
        </a>
        <p class="eyebrow">единая страница</p>
        <h1>Регистрация открывается вместе со входом</h1>
        <p class="muted-copy">Сейчас вы будете перенаправлены на страницу входа и создания аккаунта.</p>
        <a class="primary-button" href="login.html?mode=register">
          <svg><use href="icons.svg#icon-check"></use></svg>
          Открыть регистрацию
        </a>
      </section>
    </main>
    <script>
      const next = new URLSearchParams(location.search).get("next");
      const target = new URL("login.html", location.href);
      target.searchParams.set("mode", "register");
      if (next) target.searchParams.set("next", next);
      location.replace(`${target.pathname.split("/").pop()}${target.search}`);
    </script>
  </body>
</html>
